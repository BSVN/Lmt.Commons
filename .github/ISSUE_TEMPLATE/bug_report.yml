name: Bug report
description: Report a problem with a Bsn.* module
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Security vulnerabilities must **not** be reported here - use
        [private vulnerability reporting](https://github.com/BSVN/Lmt.Commons/security/advisories/new)
        instead (see [SECURITY.md](https://github.com/BSVN/Lmt.Commons/blob/main/SECURITY.md)).

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - Bsn.Common
        - Bsn.Host
        - Bsn.SystemManagement
        - Multiple / other
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Module version
      description: Output of `Get-Module -ListAvailable Bsn.*`, or "main" if built from source.
      placeholder: e.g. 0.2.4
    validations:
      required: true

  - type: input
    id: cmdlet
    attributes:
      label: Affected cmdlet(s)
      placeholder: e.g. Suspend-Computer
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `$PSVersionTable | Format-List -Force` and paste the output,
        plus your OS and version.
      placeholder: |
        PSVersion: 7.4.1 / 5.1.26200
        OS: Microsoft Windows 11 Pro 10.0.26200
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
      description: The smallest sequence of commands that shows the problem.
      placeholder: |
        1. Import-Module Bsn.SystemManagement
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error output (use `-Verbose`/`-Debug` if helpful).
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Workarounds found, screenshots, related issues.
    validations:
      required: false
