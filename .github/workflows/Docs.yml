name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'docfx.json'
      - '.config/dotnet-tools.json'
      - '.github/workflows/Docs.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'docfx.json'
      - '.config/dotnet-tools.json'
      - '.github/workflows/Docs.yml'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      # Full history so every release tag's docs/en-US content can be
      # extracted. Release events check out main: the release trigger
      # itself checks out the tag, but all version builds (including
      # main's) read their Markdown through git from the configured refs.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      # docfx is pinned in .config/dotnet-tools.json. There is no
      # Dependabot ecosystem for dotnet-tools manifests, so version bumps
      # are manual - same policy as the PowerShell build dependencies.
      - name: Restore the pinned docfx tool
        run: dotnet tool restore

      # docfx.json sets warningsAsErrors: a broken link or a page missing
      # from docs/toc.yml fails this step. Pull requests only rebuild the
      # main set (the gate); pushes to main and releases build every
      # version - main, the latest release at the site root, and one set
      # per release tag.
      - name: Build the documentation site
        shell: pwsh
        run: ./tools/Build-AllDocs.ps1 -SiteOutputDir site -MainOnly:($env:GITHUB_EVENT_NAME -eq 'pull_request')

      - name: Upload the site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # Self-enables Pages with the "GitHub Actions" build source on the
      # first run (no-op afterwards). continue-on-error keeps the deploy
      # working when the call is redundant or the token lacks permission
      # because Pages was configured manually in the repository settings.
      - name: Enable GitHub Pages for the workflow source
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The multi-version site is tens of megabytes; the backend
          # deployment regularly exceeds the action's default 10-minute
          # polling window ("Timeout reached, aborting!").
          timeout: 1800000
