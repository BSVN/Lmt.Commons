name: Publish modules

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate publishing logic without touching the gallery.'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Package and publish to the PowerShell Gallery
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Bootstrap development dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap

      - name: Analyze, test and package every module
        shell: pwsh
        run: ./build.ps1 -Task Analyze, Test, Package

      - name: Upload module packages
        uses: actions/upload-artifact@v7
        with:
          name: module-packages
          path: out/packages/*.zip
          if-no-files-found: error

      - name: Publish to the PowerShell Gallery
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
        run: ./build.ps1 -Task Publish

      - name: Mirror modules to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -Task Mirror -MirrorRepository 'https://nuget.pkg.github.com/BSVN/index.json'
