name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write   # Codecov OIDC token exchange (tokenless default-branch uploads)
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install asciinema (Linux cross-check tool)
        if: runner.os == 'Linux'
        # ':all:' must stay quoted: unquoted, the colon+space after :all: turns
        # this scalar into a nested YAML mapping and invalidates the whole
        # workflow file (runs then fail in 0s with no jobs - see PR history).
        run: pip install --only-binary ':all:' asciinema==2.4.0

      - name: Build console-logger (Windows cross-check tool)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'console-logger'
          git clone --depth 1 https://github.com/rhubarb-geek-nz/console-logger.git $toolDir
          Push-Location "$toolDir\win32"
          $vcvars = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (Test-Path $vcvars) {
            cmd /c "`"$vcvars`" >NUL && cl /W4 /O2 conlog.c /Fe:conlog.exe" 2>&1 | Write-Verbose
            if (Test-Path conlog.exe) {
              Add-Content -LiteralPath $env:GITHUB_PATH -Value "$toolDir\win32"
              Write-Host "conlog.exe built successfully"
            } else {
              Write-Warning "conlog.exe build failed; console-logger cross-check test will skip"
            }
          } else {
            Write-Warning "Visual Studio not found; console-logger cross-check test will skip"
          }
          Pop-Location

      - name: Install oh-my-posh (Windows multi-byte stress test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Deterministic pinned install (direct download; winget is not
          # version-pinnable). The issue #5 stress test depends on this binary:
          # if it cannot be installed the job fails - never a silent skip.
          $version = '31.9.1'
          $expectedHash = 'c2b34d2e8d9db243172170ce4adb70b0bd1476d29d355bc783cfa886724eb27e'
          $installDir = Join-Path $env:RUNNER_TEMP 'oh-my-posh'
          $themesDir = Join-Path $installDir 'themes'
          New-Item -ItemType Directory -Path $themesDir -Force | Out-Null

          $exePath = Join-Path $installDir 'oh-my-posh.exe'
          Invoke-WebRequest -Uri "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v$version/posh-windows-amd64.exe" -OutFile $exePath

          $actualHash = (certutil -hashfile $exePath SHA256 | Select-Object -Skip 1 -First 1).Trim()
          if ($actualHash -ne $expectedHash) {
            throw "oh-my-posh v$version SHA256 mismatch: expected $expectedHash, got $actualHash."
          }

          $reported = (& $exePath version)
          if ($LASTEXITCODE -ne 0 -or -not $reported) {
            throw "oh-my-posh v$version failed to execute (exit code $LASTEXITCODE)."
          }
          Write-Host "oh-my-posh $reported installed (SHA256 verified)"

          # The stress test prefers $env:POSH_THEMES_PATH\atomic.omp.json (a
          # nerd-font glyph-rich theme); provide it from the same release.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/v$version/themes/atomic.omp.json" -OutFile (Join-Path $themesDir 'atomic.omp.json')

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDir
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "POSH_THEMES_PATH=$themesDir"

      - name: Bootstrap development dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap

      - name: Analyze and test every module
        shell: pwsh
        run: ./build.ps1 -Task Analyze, Test -CodeCoverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: out/testResults.*.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: out/coverage.*.xml
          flags: powershell,${{ matrix.os }}
          fail_ci_if_error: false
          use_oidc: true
