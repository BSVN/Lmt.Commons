name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, ubuntu-24.04, macos-latest ]
      # ubuntu-24.04 is pinned on purpose: ubuntu-latest follows the newest LTS
      # (26.04, util-linux 2.41), while 24.04 keeps an older script(1) and
      # util-linux generation in the matrix - the Unix script(1) engine has
      # version-sensitive invocation compatibility (see Start-BsnUnixPtyRecording
      # and Get-BsnScriptInvocationArguments), and the Unix -Command system test
      # pins that behavior on both generations.
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write   # Codecov OIDC token exchange (tokenless default-branch uploads)
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install asciinema (Linux cross-check tool)
        if: runner.os == 'Linux'
        # ':all:' must stay quoted: unquoted, the colon+space after :all: turns
        # this scalar into a nested YAML mapping and invalidates the whole
        # workflow file (runs then fail in 0s with no jobs - see PR history).
        run: pip install --only-binary ':all:' asciinema==2.4.0

      - name: Build console-logger (Windows cross-check tool)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'console-logger'
          git clone --depth 1 https://github.com/rhubarb-geek-nz/console-logger.git $toolDir
          Push-Location "$toolDir\win32"
          $vcvars = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (Test-Path $vcvars) {
            cmd /c "`"$vcvars`" >NUL && cl /W4 /O2 conlog.c /Fe:conlog.exe" 2>&1 | Write-Verbose
            if (Test-Path conlog.exe) {
              Add-Content -LiteralPath $env:GITHUB_PATH -Value "$toolDir\win32"
              Write-Host "conlog.exe built successfully"
            } else {
              Write-Warning "conlog.exe build failed; console-logger cross-check test will skip"
            }
          } else {
            Write-Warning "Visual Studio not found; console-logger cross-check test will skip"
          }
          Pop-Location

      - name: Install oh-my-posh (Windows multi-byte stress test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # winget is the idiomatic installer (review decision). The version is
          # pinned with --version/--exact, and winget verifies the downloaded
          # installer against the winget-pkgs manifest InstallerSha256 during
          # install - no manual hash step needed
          # (https://learn.microsoft.com/en-us/windows/package-manager/winget/hash).
          # The issue #5 stress test depends on this binary: if the install
          # fails the job fails - never a silent skip.
          winget install --id JanDeDobbeleer.OhMyPosh --version 31.9.1 --exact --silent --disable-interactivity --accept-source-agreements --accept-package-agreements

          # The winget package is an MSIX (ohmyposh.cli). Its public entry
          # point is the app execution alias in WindowsApps - a reparse point
          # that fails to execute from pwsh under redirected stdio on hosted
          # runners ("StandardOutputEncoding is only supported when standard
          # output is redirected"). Resolve the REAL package binary via
          # Get-AppxPackage and use it for verification and PATH.
          $appx = Get-AppxPackage -Name 'ohmyposh.cli' -ErrorAction Stop
          if (-not $appx) {
            throw 'ohmyposh.cli package not found after winget install.'
          }
          if ($appx.Version -ne '31.9.1.0') {
            throw "oh-my-posh package version $($appx.Version) installed; expected 31.9.1.0."
          }

          $packageExe = Join-Path $appx.InstallLocation 'oh-my-posh.exe'
          if (-not (Test-Path -LiteralPath $packageExe)) {
            throw "oh-my-posh.exe not found inside the package at $packageExe."
          }

          # Hard verification: the binary must execute and report the pinned version.
          $reported = ("{0}" -f (& $packageExe version)).Trim()
          if ($LASTEXITCODE -ne 0 -or $reported -ne '31.9.1') {
            throw "oh-my-posh reported '$reported' (exit $LASTEXITCODE); expected 31.9.1."
          }
          Write-Host "oh-my-posh $reported installed via winget ($packageExe)"

          # GITHUB_PATH is prepended, so 'oh-my-posh' resolves to the package
          # binary, not the WindowsApps alias reparse point.
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $appx.InstallLocation

          # The MSIX ships the themes inside the package directory; point the
          # stress test at the glyph-rich atomic theme when present (it falls
          # back to the default theme, which still renders nerd-font glyphs).
          $themesDir = Join-Path $appx.InstallLocation 'themes'
          if (Test-Path -LiteralPath (Join-Path $themesDir 'atomic.omp.json')) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "POSH_THEMES_PATH=$themesDir"
            Write-Host 'POSH_THEMES_PATH set; the stress test will use atomic.omp.json'
          }
          else {
            Write-Host 'No themes directory found; the stress test will render the default theme.'
          }

      - name: Bootstrap development dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap

      - name: Analyze and test every module
        shell: pwsh
        run: ./build.ps1 -Task Analyze, Test -CodeCoverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: out/testResults.*.xml
          if-no-files-found: ignore
      - name: Upload C# coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: out/csharp-coverage.*.xml
          flags: csharp,${{ matrix.os }}
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: out/coverage.*.xml
          flags: powershell,${{ matrix.os }}
          fail_ci_if_error: false
          use_oidc: true
