name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, ubuntu-24.04, macos-latest ]
      # ubuntu-24.04 is pinned on purpose: ubuntu-latest follows the newest LTS
      # (26.04, util-linux 2.41), while 24.04 keeps an older script(1) and
      # util-linux generation in the matrix - the Unix script(1) engine has
      # version-sensitive invocation compatibility (see Start-BsnUnixPtyRecording
      # and Get-BsnScriptInvocationArguments), and the Unix -Command system test
      # pins that behavior on both generations.
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write   # Codecov OIDC token exchange (tokenless default-branch uploads)
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install asciinema (Linux cross-check tool)
        if: runner.os == 'Linux'
        # ':all:' must stay quoted: unquoted, the colon+space after :all: turns
        # this scalar into a nested YAML mapping and invalidates the whole
        # workflow file (runs then fail in 0s with no jobs - see PR history).
        run: pip install --only-binary ':all:' asciinema==2.4.0

      - name: Build console-logger (Windows cross-check tool)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'console-logger'
          git clone --depth 1 https://github.com/rhubarb-geek-nz/console-logger.git $toolDir
          Push-Location "$toolDir\win32"
          $vcvars = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (Test-Path $vcvars) {
            cmd /c "`"$vcvars`" >NUL && cl /W4 /O2 conlog.c /Fe:conlog.exe" 2>&1 | Write-Verbose
            if (Test-Path conlog.exe) {
              Add-Content -LiteralPath $env:GITHUB_PATH -Value "$toolDir\win32"
              Write-Host "conlog.exe built successfully"
            } else {
              Write-Warning "conlog.exe build failed; console-logger cross-check test will skip"
            }
          } else {
            Write-Warning "Visual Studio not found; console-logger cross-check test will skip"
          }
          Pop-Location

      - name: Install oh-my-posh (Windows multi-byte stress test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Bounded, pinned direct download of the portable binary. The
          # winget package for this version is an MSIX whose deployment and
          # app-execution alias HUNG hosted Windows runners indefinitely at
          # this step (two stuck runs observed), and executing the alias
          # from pwsh fails under redirected stdio - so CI downloads the
          # pinned release artifact directly and verifies it by SHA-256
          # (asset of the v31.9.1 release, verified locally). Locally,
          # 'winget install JanDeDobbeleer.OhMyPosh' remains a fine way to
          # install the tool.
          $version = '31.9.1'
          $expectedSha256 = 'C2B34D2E8D9DB243172170CE4ADB70B0BD1476D29D355BC783CFA886724EB27E'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'oh-my-posh'
          New-Item -ItemType Directory -Path $installDirectory -Force | Out-Null
          $exePath = Join-Path $installDirectory 'oh-my-posh.exe'

          Invoke-WebRequest `
            -Uri "https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v$version/posh-windows-amd64.exe" `
            -OutFile $exePath -TimeoutSec 120

          $actualSha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "oh-my-posh $version SHA-256 mismatch: expected $expectedSha256, got $actualSha256."
          }

          # Hard verification: the binary must execute and report the pinned version.
          $reported = ("{0}" -f (& $exePath version)).Trim()
          if ($LASTEXITCODE -ne 0 -or $reported -ne '31.9.1') {
            throw "oh-my-posh reported '$reported' (exit $LASTEXITCODE); expected 31.9.1."
          }
          Write-Host "oh-my-posh $reported installed (SHA-256 verified, portable)"

          # GITHUB_PATH is prepended, so the recorded session resolves
          # 'oh-my-posh' to this pinned portable binary.
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDirectory

          # The stress test prefers the glyph-rich atomic theme; ship it from
          # the same pinned release. A theme download failure is non-fatal -
          # the test falls back to the default theme, which still renders
          # nerd-font glyphs.
          try {
            $themePath = Join-Path $installDirectory 'atomic.omp.json'
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/v$version/themes/atomic.omp.json" `
              -OutFile $themePath -TimeoutSec 60
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "POSH_THEMES_PATH=$installDirectory"
            Write-Host 'POSH_THEMES_PATH set; the stress test will use atomic.omp.json'
          }
          catch {
            Write-Host "atomic.omp.json download failed ($($_.Exception.Message)); the stress test will render the default theme."
          }

      - name: Bootstrap development dependencies
        shell: pwsh
        run: ./build.ps1 -Bootstrap

      - name: Analyze and test every module
        shell: pwsh
        run: ./build.ps1 -Task Analyze, Test -CodeCoverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: out/testResults.*.xml
          if-no-files-found: ignore
      - name: Upload C# coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: out/csharp-coverage.*.xml
          flags: csharp,${{ matrix.os }}
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: out/coverage.*.xml
          flags: powershell,${{ matrix.os }}
          fail_ci_if_error: false
          use_oidc: true
